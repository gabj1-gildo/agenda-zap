<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>AgendaZap · Funil de Vendas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

  :root{
    --amber:#fdb022;
    --violet:#a78bfa;
    --violet-soft: rgba(167,139,250,.14);
    --violet-line: rgba(167,139,250,.4);

    --wash-1: rgba(167,139,250,.10);
    --wash-2: rgba(253,176,34,.08);
  }

  html[data-theme="dark"]{
    --bg:#060a13;
    --surface:#0d1424;
    --surface-2:#121b30;
    --surface-3:#182236;
    --border: rgba(255,255,255,.07);
    --border-soft: rgba(255,255,255,.04);
    --text:#eef1f8;
    --muted:#7c88a4;
    --muted-dim:#4d5875;
    --shadow: 0 10px 22px -12px rgba(0,0,0,.55);
    --avatar-text:#0a0f1a;
  }

  html[data-theme="light"]{
    --bg:#eef1f7;
    --surface:#ffffff;
    --surface-2:#f7f9fc;
    --surface-3:#eef1f6;
    --border: rgba(15,23,42,.09);
    --border-soft: rgba(15,23,42,.05);
    --text:#111827;
    --muted:#64748b;
    --muted-dim:#98a2b3;
    --shadow: 0 10px 22px -14px rgba(15,23,42,.25);
    --avatar-text:#0a0f1a;
    --wash-1: rgba(167,139,250,.05);
    --wash-2: rgba(253,176,34,.05);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background:
      radial-gradient(1100px 500px at 15% -10%, var(--wash-1), transparent 60%),
      radial-gradient(900px 500px at 85% 0%, var(--wash-2), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding: 28px clamp(16px, 4vw, 48px) 60px;
    transition: background-color .25s ease, color .25s ease;
  }

  ::selection{ background: var(--violet-soft); color:#fff; }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; margin-bottom:34px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px;
    background: linear-gradient(135deg, var(--amber), var(--violet));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 1px rgba(255,255,255,.08), 0 8px 22px -6px rgba(253,176,34,.45);
    flex-shrink:0;
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-text{ line-height:1.15; }
  .brand-text .name{
    font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:17px; letter-spacing:.2px;
  }
  .brand-text .role{ font-size:11.5px; color:var(--muted); }

  .topbar-right{ display:flex; align-items:center; gap:10px; }

  .search-wrap{ position:relative; width: min(300px, 100%); }
  .search-wrap input{
    width:100%; background:var(--surface-2); border:1px solid var(--border);
    color:var(--text); font-size:13.5px; padding:10px 14px 10px 38px;
    border-radius:11px; outline:none; transition: border-color .18s, background .18s;
    font-family:'Inter', sans-serif;
  }
  .search-wrap input:focus{ border-color: var(--violet-line); background:var(--surface-3); }
  .search-wrap input::placeholder{ color: var(--muted-dim); }
  .search-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; color:var(--muted);
  }

  .theme-toggle{
    width:38px; height:38px; border-radius:11px; flex-shrink:0;
    background:var(--surface-2); border:1px solid var(--border); color:var(--muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: background .18s, color .18s, border-color .18s, transform .18s;
  }
  .theme-toggle:hover{ color:var(--text); border-color:var(--violet-line); }
  .theme-toggle:active{ transform: scale(.92); }
  .theme-toggle svg{ width:17px; height:17px; }

  /* ---------- hero / signature flow bar ---------- */
  .hero{ margin-bottom:30px; }
  .hero .eyebrow{
    font-size:11px; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--muted); font-weight:600; margin-bottom:8px;
  }
  .hero h1{
    font-family:'Space Grotesk', sans-serif; font-weight:700;
    font-size:clamp(26px, 3.4vw, 34px); letter-spacing:-.3px; margin-bottom:6px;
  }
  .hero p{ color:var(--muted); font-size:13.5px; max-width:520px; margin-bottom:22px; }

  .flowbar-shell{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px 18px 14px; transition: background-color .25s, border-color .25s;
  }
  .flowbar-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .flowbar-top .label{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted-dim); font-weight:600; line-height:1; }
  .flowbar-top .total{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); line-height:1; font-variant-numeric: tabular-nums; }
  .flowbar-top .total b{ color:var(--text); font-weight:500; }

  .flowbar{
    position:relative; display:flex; height:10px; border-radius:999px;
    overflow:hidden; background:var(--surface-3);
  }
  .flowbar .seg{
    position:relative; overflow:hidden;
    transition: flex-grow .55s cubic-bezier(.4,0,.2,1);
    min-width: 3px;
    border-right: 2px solid var(--surface);
  }
  .flowbar .seg:last-child{ border-right:none; }
  .flowbar .seg::after{
    content:''; position:absolute; inset:0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    width:40%; animation: shimmer 2.6s linear infinite;
  }
  @keyframes shimmer{
    0%{ transform: translateX(-120%); }
    100%{ transform: translateX(340%); }
  }

  .flow-legend{
    display:grid; grid-template-columns: repeat(3, 1fr); gap:12px 16px;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft);
  }
  .flow-legend .item{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); min-width:0; }
  .flow-legend .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .flow-legend .item .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .flow-legend .item b{
    color:var(--text); font-weight:500; font-family:'JetBrains Mono', monospace; font-size:12px;
    margin-left:auto; flex-shrink:0; font-variant-numeric: tabular-nums; padding-left:8px;
  }
  @media (max-width: 640px){
    .flow-legend{ grid-template-columns: repeat(2, 1fr); }
  }

  /* ---------- board ---------- */
  .board{
    display:flex; align-items:flex-start;
    overflow-x:auto; padding-bottom:14px; margin: 0 -6px;
  }
  .board::-webkit-scrollbar{ height:8px; }
  .board::-webkit-scrollbar-thumb{ background:var(--surface-3); border-radius:99px; }
  .board::-webkit-scrollbar-track{ background:transparent; }

  .connector{
    flex:0 0 26px; width:26px; height:20px; margin-top:37px; position:relative;
  }
  .connector::before{
    content:''; position:absolute; top:9px; left:0; width:100%; height:2px;
    background: linear-gradient(90deg, var(--seg-a), var(--seg-b)); opacity:.45;
  }
  .connector .dot{
    position:absolute; top:6px; width:6px; height:6px; border-radius:50%; left:0;
    background: var(--seg-b); box-shadow: 0 0 8px 1px var(--seg-b);
    animation: flowDot 2.4s linear infinite;
  }
  @keyframes flowDot{
    0%{ left:-2px; opacity:0; }
    14%{ opacity:1; }
    86%{ opacity:1; }
    100%{ left:calc(100% - 4px); opacity:0; }
  }
  @media (max-width: 560px){ .connector{ display:none; } }

  .column{
    background:var(--surface); border:1px solid var(--border);
    border-radius:16px; min-height:420px; width:270px; flex:0 0 270px;
    display:flex; flex-direction:column; margin: 0 6px; overflow:hidden;
    transition: background .18s, border-color .18s, box-shadow .18s;
    position:relative;
  }
  .column.drag-over{ box-shadow: 0 0 0 1px var(--seg-line), 0 0 26px -6px var(--seg-line); }

  .col-head{
    display:flex; align-items:center; justify-content:space-between;
    padding: 13px 14px; border-top: 3px solid var(--seg);
    background: var(--seg-soft);
  }
  .col-title{ display:flex; align-items:center; gap:9px; min-width:0; }
  .col-icon{
    width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
    background: var(--surface); color: var(--seg);
  }
  .col-icon svg{ width:14px; height:14px; }

  .col-title span{
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:12.5px; letter-spacing:.3px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .badge{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:500;
    padding:2px 9px; border-radius:999px; background:var(--surface); color:var(--text);
    min-width:22px; text-align:center; flex-shrink:0; margin-left:8px;
  }
  .badge.pulse{ animation: badgePulse .5s ease; }
  @keyframes badgePulse{
    0%{ transform:scale(1); }
    35%{ transform:scale(1.35); }
    100%{ transform:scale(1); }
  }

  .col-body{ display:flex; flex-direction:column; gap:9px; flex:1; min-height:60px; padding:12px; }

  /* ---------- cards ---------- */
  .card{
    background:var(--surface-2); border:1px solid var(--border-soft);
    border-radius:12px; padding:12px 13px; cursor:grab;
    display:flex; align-items:center; gap:11px;
    animation: cardIn .35s cubic-bezier(.2,.8,.2,1) backwards;
    transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
    position:relative;
  }
  .card:active{ cursor:grabbing; }
  .card:hover{
    transform: translateY(-2px);
    border-color: var(--border);
    background: var(--surface-3);
    box-shadow: var(--shadow);
  }
  .card.dragging{ opacity:.35; }
  .card:focus-visible{ outline:2px solid var(--seg); outline-offset:2px; }

  @keyframes cardIn{
    from{ opacity:0; transform: translateY(8px) scale(.97); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .avatar{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:13px; color:var(--avatar-text);
    background: linear-gradient(135deg, var(--seg), var(--seg-light));
  }

  .card-info{ min-width:0; flex:1; }
  .card-name{ font-size:13.5px; font-weight:600; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-phone{
    display:flex; align-items:center; gap:5px; font-family:'JetBrains Mono', monospace;
    font-size:11.5px; color:var(--muted);
  }
  .card-phone svg{ width:11px; height:11px; flex-shrink:0; opacity:.8; }

  .ia-chip{
    display:flex; align-items:center; gap:4px; font-size:9.5px; font-weight:600;
    letter-spacing:.4px; color:var(--seg); background:var(--seg-soft);
    padding:2px 7px 2px 6px; border-radius:999px; flex-shrink:0; text-transform:uppercase;
  }
  .ia-chip svg{ width:9px; height:9px; }

  /* ---------- empty state ---------- */
  .empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:var(--muted-dim); padding: 30px 14px; gap:8px; border-radius:12px;
    border:1px dashed var(--border);
  }
  .empty svg{ width:22px; height:22px; opacity:.5; }
  .empty p{ font-size:12px; max-width:150px; line-height:1.4; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:.001s !important; animation-iteration-count:1 !important; transition-duration:.05s !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#0a0f1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg>
      </div>
      <div class="brand-text">
        <div class="name">AgendaZap</div>
        <div class="role">Lucas Ramos Nutr…</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="text" placeholder="Buscar por nome ou telefone…" />
      </div>
      <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema"></button>
    </div>
  </div>

  <div class="hero">
    <div class="eyebrow">Funil</div>
    <h1>Funil de Vendas</h1>
    <p>Acompanhe seus leads em tempo real. Classificação de estágio feita via IA.</p>

    <div class="flowbar-shell">
      <div class="flowbar-top">
        <span class="label">Distribuição do funil</span>
        <span class="total"><b id="totalCount">7</b> leads no total</span>
      </div>
      <div class="flowbar" id="flowbar"></div>
      <div class="flow-legend" id="flowLegend"></div>
    </div>
  </div>

  <div class="board" id="board"></div>

<script>
  const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>';

  const ICONS = {
    espera:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
    ia:         '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><rect x="6" y="6" width="12" height="12" rx="3"/><circle cx="9.5" cy="11.5" r="1"/><circle cx="14.5" cy="11.5" r="1"/></svg>',
    humano:     '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13a9 9 0 0 1 18 0"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h1a2 2 0 0 1 2 2Z"/><path d="M3 19a2 2 0 0 0 2 2h1v-6H5a2 2 0 0 0-2 2Z"/></svg>',
    pagamento:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>',
    finalizado: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 5-5"/></svg>',
    perdido:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9.5 9.5 5 5M14.5 9.5l-5 5"/></svg>'
  };
  const PHONE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.362 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.338 1.85.573 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>';

  // Six distinct hues spaced around the wheel so no two stages read as "the same color"
  const STAGES = [
    { key:'espera',     title:'Espera',          color:'#f5a524', rgb:'245,165,36',  light:'#ffd98f' },
    { key:'ia',         title:'Atendimento IA',  color:'#8b5cf6', rgb:'139,92,246',  light:'#d3c4ff' },
    { key:'humano',     title:'Atend. Humano',   color:'#3b82f6', rgb:'59,130,246',  light:'#bcd8ff' },
    { key:'pagamento',  title:'Aguard. Pagto',   color:'#14b8a6', rgb:'20,184,166',  light:'#8ff0e2' },
    { key:'finalizado', title:'Finalizado',      color:'#22c55e', rgb:'34,197,94',   light:'#a6f0c0' },
    { key:'perdido',    title:'Perdido',         color:'#f43f5e', rgb:'244,63,94',   light:'#ffb8c4' },
  ];

  let data = {
    espera: [
      { id:'c1', name:'.',                 phone:'+55 (41) 9626-4555' },
      { id:'c2', name:'Luiz Eduardo',       phone:'+55 (38) 9269-5410' },
      { id:'c3', name:'GKL Systems',        phone:'+55 (38) 9805-1939' },
      { id:'c4', name:'teste 123',          phone:'+55 (38) 9 9104-6845' },
    ],
    ia: [
      { id:'c5', name:'Kauan',              phone:'+55 (38) 9898-2897' },
      { id:'c6', name:'Gildo',              phone:'+55 (38) 9104-6845' },
      { id:'c7', name:'Júnior (Brasil Terra)', phone:'+55 (38) 9738-1090' },
    ],
    humano: [],
    pagamento: [],
    finalizado: [],
    perdido: []
  };

  const boardEl = document.getElementById('board');
  const flowbarEl = document.getElementById('flowbar');
  const legendEl = document.getElementById('flowLegend');
  let draggedId = null;
  let draggedFrom = null;

  function initials(name){
    const clean = name.replace(/[().]/g,'').trim();
    if(!clean) return '•';
    const parts = clean.split(' ').filter(Boolean);
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  function segStyle(stage){
    return `--seg:${stage.color}; --seg-soft:rgba(${stage.rgb},.14); --seg-line:rgba(${stage.rgb},.45); --seg-light:${stage.light};`;
  }

  function buildFlowbarAndLegend(){
    flowbarEl.innerHTML = STAGES.map(s => `<div class="seg" data-seg="${s.key}" style="background:${s.color}; flex-grow:0.001;"></div>`).join('');
    legendEl.innerHTML = STAGES.map(s => `
      <div class="item">
        <span class="dot" style="background:${s.color}"></span>
        <span class="name">${s.title}</span>
        <b id="leg-${s.key}">0</b>
      </div>`).join('');
  }

  function render(){
    boardEl.innerHTML = '';

    STAGES.forEach((stage, i) => {
      if(i > 0){
        const prev = STAGES[i - 1];
        const connector = document.createElement('div');
        connector.className = 'connector';
        connector.style.cssText = `--seg-a:${prev.color}; --seg-b:${stage.color};`;
        connector.innerHTML = '<span class="dot"></span>';
        boardEl.appendChild(connector);
      }

      const items = data[stage.key];
      const col = document.createElement('div');
      col.className = 'column';
      col.dataset.stage = stage.key;
      col.style.cssText = segStyle(stage);

      col.innerHTML = `
        <div class="col-head">
          <div class="col-title">
            <div class="col-icon">${ICONS[stage.key]}</div>
            <span>${stage.title.toUpperCase()}</span>
          </div>
          <div class="badge" data-badge="${stage.key}">${items.length}</div>
        </div>
        <div class="col-body" data-body="${stage.key}"></div>
      `;

      const body = col.querySelector('.col-body');

      if(items.length === 0){
        body.innerHTML = `
          <div class="empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v18M3 12h18"/></svg>
            <p>Nenhum lead por aqui. Arraste um card para cá.</p>
          </div>`;
      } else {
        items.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.draggable = true;
          card.dataset.id = item.id;
          card.style.animationDelay = (idx * 45) + 'ms';
          card.tabIndex = 0;
          card.innerHTML = `
            <div class="avatar">${initials(item.name)}</div>
            <div class="card-info">
              <div class="card-name">${item.name}</div>
              <div class="card-phone">${PHONE_ICON}${item.phone}</div>
            </div>
            ${stage.key === 'ia' ? `<span class="ia-chip"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.6 5.2L19 9l-5.4 1.8L12 16l-1.6-5.2L5 9l5.4-1.8L12 2z"/></svg>IA</span>` : ''}
          `;

          card.addEventListener('dragstart', e => {
            draggedId = item.id;
            draggedFrom = stage.key;
            requestAnimationFrame(() => card.classList.add('dragging'));
            e.dataTransfer.effectAllowed = 'move';
          });
          card.addEventListener('dragend', () => card.classList.remove('dragging'));

          body.appendChild(card);
        });
      }

      col.addEventListener('dragover', e => {
        e.preventDefault();
        col.classList.add('drag-over');
      });
      col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
      col.addEventListener('drop', e => {
        e.preventDefault();
        col.classList.remove('drag-over');
        if(!draggedId || draggedFrom === stage.key) return;
        moveCard(draggedId, draggedFrom, stage.key);
      });

      boardEl.appendChild(col);
    });

    updateFlowbar();
  }

  function moveCard(id, from, to){
    const idx = data[from].findIndex(c => c.id === id);
    if(idx === -1) return;
    const [card] = data[from].splice(idx, 1);
    data[to].push(card);
    render();
    pulseBadge(to);
  }

  function pulseBadge(stageKey){
    const badge = document.querySelector(`[data-badge="${stageKey}"]`);
    if(!badge) return;
    badge.classList.remove('pulse');
    void badge.offsetWidth;
    badge.classList.add('pulse');
  }

  function updateFlowbar(){
    const counts = STAGES.map(s => data[s.key].length);
    const total = counts.reduce((a,b)=>a+b, 0);
    document.getElementById('totalCount').textContent = total;

    STAGES.forEach((s, i) => {
      const seg = flowbarEl.querySelector(`[data-seg="${s.key}"]`);
      const val = counts[i];
      seg.style.flexGrow = val > 0 ? val : 0.001;
      document.getElementById('leg-' + s.key).textContent = val;
    });
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(card => {
      const name = card.querySelector('.card-name').textContent.toLowerCase();
      const phone = card.querySelector('.card-phone').textContent.toLowerCase();
      const match = !q || name.includes(q) || phone.includes(q);
      card.style.display = match ? 'flex' : 'none';
    });
  });

  const themeToggle = document.getElementById('themeToggle');
  function applyThemeIcon(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeToggle.innerHTML = isDark ? SUN : MOON;
  }
  themeToggle.addEventListener('click', () => {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    applyThemeIcon();
  });
  applyThemeIcon();

  buildFlowbarAndLegend();
  render();
</script>
</body>
</html>
